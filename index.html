<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<title>Віртуальний 3D-тур клінікою Ligamenta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta http-equiv="x-ua-compatible" content="IE=edge" />
<meta name="referrer" content="no-referrer-when-downgrade" />
<style>
@-ms-viewport { width: device-width; }
@media only screen and (min-device-width: 800px) { html { overflow: hidden; } }
html { height: 100%; }
body {
  height: 100%;
  overflow: hidden;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  color: #FFFFFF;
  background-color: #000000;
}
#pano { width: 100%; height: 100%; }
</style>
</head>
<body>

<script src="3dtour.js"></script>

<script>
  // У cross-origin iframe плагін swfaddress.js падає з SecurityError,
  // бо намагається читати top.document для синхронізації URL з батьківським
  // вікном (для deep-linking). Браузер блокує це з причин безпеки, виняток
  // не перехоплюється, і це ламає ініціалізацію krpano — тур чорний.
  //
  // Розв'язок:
  //   • в iframe — НЕ завантажуємо swfaddress.js. Замість нього підкладаємо
  //     stub-об'єкт із no-op методами. Плагін sa.js, який krpano підвантажує
  //     з XML, очікує саме цей API і буде задоволений stub-ом.
  //   • standalone — завантажуємо справжній swfaddress.js як було.
  //
  // Платою за stub є втрата URL-deep-linking при перегляді в iframe (хеш
  // батьківської сторінки не буде змінюватись при переходах між сценами).
  // Для embed-сценарію це навіть бажана поведінка.
  (function () {
    if (window.self !== window.top) {
      window.SWFAddress = {
        getValue: function () { return ''; },
        setValue: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        setHistory: function () {},
        setTitle: function () {},
        getTitle: function () { return document.title; },
        setStrict: function () {},
        getStrict: function () { return false; },
        setTracker: function () {},
        back: function () {},
        forward: function () {},
        go: function () {}
      };
    } else {
      // Завантажуємо справжній swfaddress.js синхронно (через document.write),
      // щоб ініціалізація встигла до виклику embedpano нижче.
      document.write('<scr' + 'ipt src="plugin/swfaddress.js?tracker=null"><\/scr' + 'ipt>');
    }
  })();
</script>

<div id="pano">
  <noscript>
    <table style="width:100%;height:100%;">
      <tr style="vertical-align:middle;text-align:center;">
        <td>ERROR:<br><br>Для роботи 3D-туру потрібно увімкнути JavaScript.<br><br></td>
      </tr>
    </table>
  </noscript>
  <script>
    embedpano({
      swf: "3dtour.swf",
      xml: "3dtour.xml",
      target: "pano",
      html5: "prefer",
      mobilescale: 1.0,
      initvars: { address_swf: "true", lang: "uk" }
    });
  </script>
</div>

<script>
  function krpano() { return document.getElementById('krpanoSWFObject'); }
  function back()    { history.back(); }
  function forward() { history.forward(); }

  // ===== Brute-force initial scene loader =====
  // У cross-origin iframe (наприклад, GitHub Pages → Webflow) плагін
  // swfaddress не може встановити URL-хеш у батьківському вікні через
  // обмеження браузера. Як наслідок, сцена-роутер s00 не перенаправляє
  // на справжню стартову s100, і тур чорний. Тут найгрубіший підхід:
  // кожні 600мс протягом 15 секунд викликаємо loadscene(s100) безумовно.
  // krpano ігнорує повторні виклики тієї ж сцени, тож це не зашкодить.
  // Як тільки krpano API доступний — сцена завантажиться.
  (function () {
    var TARGET_SCENE = 's100';
    var attempts = 0;
    var MAX_ATTEMPTS = 25; // ~15 секунд
    var loadedOnce = false;

    var interval = setInterval(function () {
      attempts++;
      var k = document.getElementById('krpanoSWFObject');

      if (k && typeof k.call === 'function') {
        try {
          k.call('loadscene(' + TARGET_SCENE + ', null, MERGE, BLEND(1))');
          loadedOnce = true;
        } catch (e) { /* not ready */ }
      }

      // Як тільки сцена завантажилась і повторно підтвердилась — стоп.
      if (loadedOnce && attempts > 3) {
        clearInterval(interval);
      }
      if (attempts >= MAX_ATTEMPTS) {
        clearInterval(interval);
      }
    }, 600);
  })();
</script>

</body>
</html>
