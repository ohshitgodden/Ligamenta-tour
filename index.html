<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<title>Віртуальний 3D-тур клінікою Ligamenta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta http-equiv="x-ua-compatible" content="IE=edge" />
<meta name="referrer" content="no-referrer-when-downgrade" />
<style>
@-ms-viewport { width: device-width; }
@media only screen and (min-device-width: 800px) { html { overflow: hidden; } }
html { height: 100%; }
body {
  height: 100%;
  overflow: hidden;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  color: #FFFFFF;
  background-color: #000000;
}
#pano { width: 100%; height: 100%; }
</style>
</head>
<body>

<script src="3dtour.js"></script>
<script src="plugin/swfaddress.js?tracker=null"></script>

<div id="pano">
  <noscript>
    <table style="width:100%;height:100%;">
      <tr style="vertical-align:middle;text-align:center;">
        <td>ERROR:<br><br>Для роботи 3D-туру потрібно увімкнути JavaScript.<br><br></td>
      </tr>
    </table>
  </noscript>
  <script>
    embedpano({
      swf: "3dtour.swf",
      xml: "3dtour.xml",
      target: "pano",
      html5: "prefer",
      mobilescale: 1.0,
      passQueryParameters: true,
      initvars: { address_swf: "true", lang: "uk" }
    });
  </script>
</div>

<script>
  function krpano() { return document.getElementById('krpanoSWFObject'); }
  function back()    { history.back(); }
  function forward() { history.forward(); }

  // ===== IFRAME / fallback initial scene loader =====
  // Стара версія embedpano не підтримує onready-callback, тому замість нього
  // використовуємо polling. Кожні 200мс перевіряємо чи API krpano готовий.
  // Як тільки готовий — якщо жодна сцена не активна (типовий стан в iframe,
  // де swfaddress не тригерить початкове завантаження через cross-origin),
  // вручну завантажуємо першу сцену з XML. У standalone-режимі swfaddress
  // встигне першим — і polling нічого не зробить.
  (function () {
    var attempts = 0;
    var MAX_ATTEMPTS = 60; // ~12 секунд максимум

    function tryStart() {
      attempts++;
      var k = document.getElementById('krpanoSWFObject');

      if (k && typeof k.get === 'function') {
        try {
          // API готовий — перевіряємо чи завантажена сцена
          if (!k.get('xml.scene')) {
            var firstScene = k.get('scene[0].name');
            if (firstScene) {
              k.call('loadscene(' + firstScene + ', null, MERGE, BLEND(1))');
            }
          }
          return; // готово, polling зупиняється
        } catch (e) {
          // ще не готовий, продовжуємо poll
        }
      }

      if (attempts < MAX_ATTEMPTS) {
        setTimeout(tryStart, 200);
      }
    }

    // Стартова затримка — даємо swfaddress шанс відпрацювати першим.
    setTimeout(tryStart, 1200);
  })();
</script>

</body>
</html>
