<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<title>Віртуальний 3D-тур клінікою Ligamenta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta http-equiv="x-ua-compatible" content="IE=edge" />
<meta name="referrer" content="no-referrer-when-downgrade" />
<style>
@-ms-viewport { width: device-width; }
@media only screen and (min-device-width: 800px) { html { overflow: hidden; } }
html { height: 100%; }
body {
  height: 100%;
  overflow: hidden;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  color: #FFFFFF;
  background-color: #000000;
}
#pano { width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- krpano core loader. swfaddress (deep-linking plugin) видалено, бо ламає тур
     при вбудові у cross-origin iframe (Webflow ↔ GitHub Pages). -->
<script src="3dtour.js"></script>

<div id="pano">
  <noscript>
    <table style="width:100%;height:100%;">
      <tr style="vertical-align:middle;text-align:center;">
        <td>ERROR:<br><br>Для роботи 3D-туру потрібно увімкнути JavaScript.<br><br></td>
      </tr>
    </table>
  </noscript>
  <script>
    embedpano({
      swf: "3dtour.swf",
      xml: "3dtour.xml",
      target: "pano",
      html5: "prefer",
      mobilescale: 1.0,
      initvars: { address_swf: "false", lang: "uk" }
    });
  </script>
</div>

<script>
  function krpano() { return document.getElementById('krpanoSWFObject'); }
  function back()    { history.back(); }
  function forward() { history.forward(); }
</script>

</body>
</html>
