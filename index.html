<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<title>Віртуальний 3D-тур клінікою Ligamenta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta http-equiv="x-ua-compatible" content="IE=edge" />
<meta name="referrer" content="no-referrer-when-downgrade" />
<style>
@-ms-viewport { width: device-width; }
@media only screen and (min-device-width: 800px) { html { overflow: hidden; } }
html { height: 100%; }
body {
  height: 100%;
  overflow: hidden;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  color: #FFFFFF;
  background-color: #000000;
}
#pano { width: 100%; height: 100%; }
</style>
</head>
<body>

<script src="3dtour.js"></script>
<script src="plugin/swfaddress.js?tracker=null"></script>

<div id="pano">
  <noscript>
    <table style="width:100%;height:100%;">
      <tr style="vertical-align:middle;text-align:center;">
        <td>ERROR:<br><br>Для роботи 3D-туру потрібно увімкнути JavaScript.<br><br></td>
      </tr>
    </table>
  </noscript>
  <script>
    embedpano({
      swf: "3dtour.swf",
      xml: "3dtour.xml",
      target: "pano",
      html5: "prefer",
      mobilescale: 1.0,
      passQueryParameters: true,
      initvars: { address_swf: "true", lang: "uk" }
    });
  </script>
</div>

<script>
  function krpano() { return document.getElementById('krpanoSWFObject'); }
  function back()    { history.back(); }
  function forward() { history.forward(); }

  // ===== IFRAME-aware initial scene loader =====
  // У cross-origin iframe (наприклад, GitHub Pages → Webflow) плагін
  // swfaddress не може коректно встановити URL-хеш батьківського вікна
  // через обмеження браузера. Як наслідок, сцена-роутер s00 не отримує
  // тригер для перенаправлення на справжню стартову сцену s100, і тур
  // лишається на чорному екрані. Тут — багатоетапна підстраховка:
  //   1. Якщо ми В iframe — примусово форсимо loadscene(s100) повторно
  //      кілька разів (krpano інколи стартує з затримкою).
  //   2. Якщо standalone — swfaddress сам впорається, але робимо
  //      одноразову перевірку через 2 секунди.
  // Якщо у вашому турі стартова сцена має іншу назву — замініть 's100'.
  (function () {
    var TARGET_SCENE = 's100';
    var isInIframe = (window.self !== window.top);

    function forceLoad() {
      var k = document.getElementById('krpanoSWFObject');
      if (k && typeof k.get === 'function') {
        try {
          var currentScene = k.get('xml.scene');
          // У iframe — завжди форсимо s100, навіть якщо щось завантажене,
          // бо це може бути проміжна (роутерна) сцена s00.
          // У standalone — викликаємо тільки якщо сцена ще не активна.
          if (isInIframe || !currentScene) {
            if (!currentScene || currentScene !== TARGET_SCENE) {
              k.call('loadscene(' + TARGET_SCENE + ', null, MERGE, BLEND(1))');
            }
          }
          return true; // krpano готовий
        } catch (e) { /* not ready yet */ }
      }
      return false;
    }

    function pollAndLoad() {
      var attempts = 0;
      var MAX = 80; // ~16 секунд

      function tick() {
        attempts++;
        if (forceLoad()) return; // готово
        if (attempts < MAX) setTimeout(tick, 200);
      }

      setTimeout(tick, isInIframe ? 500 : 1500);
    }

    pollAndLoad();
  })();
</script>

</body>
</html>
